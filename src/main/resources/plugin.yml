name: Vision
version: 1.0.5
main: de.Darkness.sekret.SekretPlugin
api-version: '1.21'
author: Darkness
description: Chaotische und humorvolle Todesmechaniken.
depend: [voicechat, ItemsAdder]
libraries:
  - javazoom:jlayer:1.0.1

commands:
  vision:
    description: Verwaltet das Vision-Plugin.
    usage: /vision [menu] | language <de|en> | reload | heal <player> | infect <player> | <feature> <on|off>
  sit:
    description: Setzt eine angeleinte Person hin.
    usage: /sit <angeleinter>
  spawn:
    description: Teleportiert zum Spawn der aktuellen Welt.
    usage: /spawn [set]
  todesliste:
    description: Blendet deine persönliche Todesliste ein oder aus.
    usage: /todesliste [an|aus]

permissions:
  vision.spawn.set:
    description: Erlaubt das Festlegen des Weltspawns mit /spawn set.
    default: op
  vision.admin:
    description: Erlaubt die Verwaltung des Vision-Plugins und das Heilen von Spielern.
    default: op