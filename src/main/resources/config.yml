  enabled: true
  infection_chance: 0.01
  infection_check_seconds: 60
  infection_biomes:
    - "SNOWY_PLAINS"
    - "ICE_SPIKES"
    - "SNOWY_TAIGA"
    - "GROVE"
    - "JAGGED_PEAKS"
    - "FROZEN_PEAKS"
    - "STONY_PEAKS"
    - "SNOWY_SLOPES"
    - "SWAMP"
    - "MANGROVE_SWAMP"
    - "FROZEN_OCEAN"
    - "DEEP_FROZEN_OCEAN"
    - "COLD_OCEAN"
    - "DEEP_COLD_OCEAN"
    - "FROZEN_RIVER"
    - "JUNGLE"
    - "SPARSE_JUNGLE"
    - "BAMBOO_JUNGLE"
    - "DRIPSTONE_CAVES"
