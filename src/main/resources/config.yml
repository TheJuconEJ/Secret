  sound: "ENTITY_PLAYER_LEVELUP"
  particle: "HEART"
  particle_count: 20

tripping:
  enabled: true
  chance: 0.001
  check_interval_ticks: 20
  animation: true
  animation_delay_ticks: 4
  sound: "ENTITY_PLAYER_HURT"
  particle: "CLOUD"
  particle_count: 12

leash:
  enabled: true
  max_distance: 10.0
  owner_only_release: true

sit:
  enabled: true

