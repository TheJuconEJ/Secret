      warning_interval_seconds: 30
      warning: "&eDu fühlst dich unwohl."
      effects:
        - "NAUSEA"
      sound: "ENTITY_PLAYER_BREATH"
      particle: "HAPPY_VILLAGER"
      particle_count: 3
    stage_2:
      damage: 1.0
      damage_interval_seconds: 15
      warning_interval_seconds: 25
      warning: "&6Deine Krankheit verschlechtert sich."
