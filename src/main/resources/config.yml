language: "de"

restart:
  enabled: true
  delay_seconds: 30
  menu_command: "restart"
  commands:
    - "restart"
    - "spigot:restart"
    - "bukkit:restart"
    - "stop"
    - "minecraft:stop"
    - "bukkit:stop"
  announce_seconds: [30, 20, 10, 5, 4, 3, 2, 1]
  message: "&eDer Server wird in &c<seconds> Sekunden &eneugestartet!"
  now_message: "&cDer Server wird jetzt neugestartet!"
  stop_message: "&eDer Server wird in &c<seconds> Sekunden &eheruntergefahren!"
  stop_now_message: "&cDer Server wird jetzt heruntergefahren!"

thirst:
  enabled: true
  drain_interval_seconds: 60
  accelerated_drain_multiplier: 2
  damage_interval_seconds: 5
  damage: 1.0
  water_bottle_restore: 6
  milk_restore: 6
  positive_potion_restore: 4
  itemsadder:
    hud: "iasurvival:thirst_bar"

translations:
  en:
    restart:
      message: "&eThe server will restart in &c<seconds> seconds&e!"
      now_message: "&cThe server is restarting now!"
      stop_message: "&eThe server will shut down in &c<seconds> seconds&e!"
      stop_now_message: "&cThe server is shutting down now!"
    messages:
      same_block: "<player> died from a blowjob."
      excitement: "<player> died of excitement."
      trip: "<player> tripped while walking and died."
      leash_created: "<leashed> now belongs to <owner>."
    disease:
      death_message: "<player> died of a disease."
      stages:
        stage_1:
          warning: "&eYou feel unwell."
        stage_2:
          warning: "&6Your disease is getting worse."
        stage_3:
          warning: "&cYour disease keeps getting worse!"
        stage_4:
          warning: "&4Your body is slowly giving up..."

spawn:
  enabled: true
  max_uses: 1
  window_seconds: 600
  allow_in_combat: false
  combat_tag_seconds: 15

scheduled_sound:
  enabled: true
  timezone: "Europe/Berlin"
  time: "06:00"

death_scoreboard:
  enabled: true

messages:
  same_block: "<player> ist durch einen Blowjob gestorben."
  excitement: "<player> ist vor Erregung gestorben."
  trip: "<player> ist beim Gehen gestolpert und gestorben."
  leash_created: "<leashed> ist nun Eigentum von <owner>."

blow:
  enabled: true
  distance: 0.5
  sound: "ENTITY_PLAYER_HURT"
  particle: "CLOUD"
  particle_count: 15

excitement:
  enabled: true
  distance: 0.5
  required_time_seconds: 10
  check_interval_ticks: 10
  chance: 1.0
  sound: "ENTITY_PLAYER_LEVELUP"
  particle: "HEART"
  particle_count: 20

tripping:
  enabled: true
  chance: 0.001
  check_interval_ticks: 20
  animation: true
  animation_delay_ticks: 4
  sound: "ENTITY_PLAYER_HURT"
  particle: "CLOUD"
  particle_count: 12

leash:
  enabled: true
  max_distance: 10.0
  owner_only_release: true

sit:
  enabled: true
  click_stairs: true
  click_slabs: true
  click_players: true
  empty_hand_only: true
  max_click_distance: 4.5
  player_stack_limit: 0

disease:
  enabled: true
  infection_chance: 0.01
  infection_check_seconds: 60
  infection_biomes:
    - "SNOWY_PLAINS"
    - "ICE_SPIKES"
    - "SNOWY_TAIGA"
    - "GROVE"
    - "JAGGED_PEAKS"
    - "FROZEN_PEAKS"
    - "STONY_PEAKS"
    - "SNOWY_SLOPES"
    - "SWAMP"
    - "MANGROVE_SWAMP"
    - "FROZEN_OCEAN"
    - "DEEP_FROZEN_OCEAN"
    - "COLD_OCEAN"
    - "DEEP_COLD_OCEAN"
    - "FROZEN_RIVER"
    - "JUNGLE"
    - "SPARSE_JUNGLE"
    - "BAMBOO_JUNGLE"
    - "DRIPSTONE_CAVES"
    - "DEEP_DARK"
  spread_enabled: true
  spread_distance: 2.0
  spread_chance: 0.05
  data_save_interval_seconds: 30
  death_message: "<player> ist an einer Krankheit gestorben."
  stages:
    stage_1_seconds: 60
    stage_2_seconds: 60
    stage_3_seconds: 45
    stage_4_seconds: 30
    stage_1:
      damage: 0.0
      damage_interval_seconds: 20
      warning_interval_seconds: 30
      warning: "&eDu fühlst dich unwohl."
      effects:
        - "NAUSEA"
      sound: "ENTITY_PLAYER_BREATH"
      particle: "HAPPY_VILLAGER"
      particle_count: 3
    stage_2:
      damage: 1.0
      damage_interval_seconds: 15
      warning_interval_seconds: 25
      warning: "&6Deine Krankheit verschlechtert sich."
      effects:
        - "NAUSEA"
        - "HUNGER"
        - "WEAKNESS"
        - "SLOWNESS"
      sound: "ENTITY_PLAYER_HURT"
      particle: "SMOKE"
      particle_count: 6
    stage_3:
      damage: 2.0
      damage_interval_seconds: 10
      warning_interval_seconds: 20
      warning: "&cDeine Krankheit wird immer schlimmer!"
      effects:
        - "HUNGER"
        - "WEAKNESS"
        - "SLOWNESS"
        - "NAUSEA"
      sound: "ENTITY_PLAYER_HURT"
      particle: "SMOKE"
      particle_count: 12
    stage_4:
      damage: 3.0
      damage_interval_seconds: 5
      warning_interval_seconds: 10
      warning: "&4Dein Körper gibt langsam auf..."
      effects:
        - "HUNGER"
        - "WEAKNESS"
        - "SLOWNESS"
        - "NAUSEA"
      sound: "ENTITY_WITHER_HURT"
      particle: "SMOKE"
      particle_count: 20
  healing:
    enabled: true
    item: "GOLDEN_APPLE"
  acceleration:
    sprinting: false
    jumping: false
    fighting: false
    hunger: true
    biomes: []
    seconds_per_activity: 5