spawn:
  max_uses: 1
  window_seconds: 600
  allow_in_combat: false
  combat_tag_seconds: 15

messages:
  same_block: "<player> ist durch einen Blowjob gestorben."
  excitement: "<player> ist vor Erregung gestorben."
  trip: "<player> ist beim Gehen gestolpert und gestorben."
  leash_created: "<leashed> ist nun Eigentum von <owner>."

blow:
  enabled: true
  distance: 0.5
  sound: "ENTITY_PLAYER_HURT"
  particle: "CLOUD"
  particle_count: 15

excitement:
  enabled: true
  distance: 0.5
  required_time_seconds: 10
